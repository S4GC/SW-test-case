[project]
name = "sw-suite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "S4GC", email = "santiagoandresguamachungana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numba>=0.68.1",
    "numba-progress>=1.2.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "py-pluto>=1.2.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "spiceypy>=8.4.0",
    "tqdm>=4.70.1",
]

[project.scripts]
sw-suite = "sw_suite:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
